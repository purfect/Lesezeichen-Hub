name: Build Windows Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-windows-exe:
    # Only run for tags starting with a digit, e.g. 1.0.0, 2-beta
    if: startsWith(github.event.release.tag_name, '0') || startsWith(github.event.release.tag_name, '1') || startsWith(github.event.release.tag_name, '2') || startsWith(github.event.release.tag_name, '3') || startsWith(github.event.release.tag_name, '4') || startsWith(github.event.release.tag_name, '5') || startsWith(github.event.release.tag_name, '6') || startsWith(github.event.release.tag_name, '7') || startsWith(github.event.release.tag_name, '8') || startsWith(github.event.release.tag_name, '9')
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build Windows executable
        shell: pwsh
        run: |
          $tag = "${{ github.event.release.tag_name }}"
          $out = "Lesezeichen-Hub_${tag}.exe"
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          go mod download
          go build -trimpath -ldflags "-s -w -X main.appVersion=$tag" -o $out .
          $hash = Get-FileHash $out -Algorithm SHA256
          "$($hash.Hash)  $out" | Out-File -FilePath "$out.sha256" -Encoding ascii
          "ASSET_NAME=$out" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload executable to release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            ${{ env.ASSET_NAME }}
            ${{ env.ASSET_NAME }}.sha256

      - name: Publish update manifest
        shell: pwsh
        run: |
          $tag = "${{ github.event.release.tag_name }}"
          $repository = "${{ github.repository }}"
          $asset = $env:ASSET_NAME
          $releaseUrl = "https://github.com/$repository/releases/tag/$tag"
          $assetUrl = "https://github.com/$repository/releases/download/$tag/$asset"
          $checksumUrl = "$assetUrl.sha256"
          @{
            latest_version = $tag
            asset_name = $asset
            asset_url = $assetUrl
            checksum_url = $checksumUrl
            release_url = $releaseUrl
          } | ConvertTo-Json | Set-Content -Path version.json -Encoding utf8
          git fetch origin main
          git checkout -B main origin/main
          git add version.json
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Publish update manifest for $tag"
          git push origin HEAD:main
