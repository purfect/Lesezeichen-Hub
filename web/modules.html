<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lesezeichen – Module</title>
  <script src="/static/theme.js"></script>
  <script src="/static/navigation.js" defer></script>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="bg-shape bg-shape-1"></div>
  <div class="bg-shape bg-shape-2"></div>

  <header class="topbar">
    <div>
      <p class="eyebrow">Persönlicher Browser Hub</p>
      <h1>Lokale Module</h1>
      <p class="search-info">Lokale Webanwendungen prüfen, neu verbinden und verwalten.</p>
    </div>
    <a class="primary-link" href="/?add=module">Modul hinzufügen</a>
  </header>

  <main class="overview-main">
    <section class="panel">
      <div class="panel-head">
        <div>
          <h2>Registrierte Module</h2>
          <p id="modules-summary" class="search-info"></p>
        </div>
        <button id="check-modules" class="ghost" type="button">Verfügbarkeit prüfen</button>
      </div>
      <div id="modules-list" class="modules-grid" aria-live="polite"></div>
    </section>
  </main>

  <p id="status" class="status"></p>
  <script src="/static/modules.js" defer></script>
</body>
</html>
