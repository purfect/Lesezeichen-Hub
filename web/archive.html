<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lesezeichen Archiv</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="bg-shape bg-shape-1"></div>
  <div class="bg-shape bg-shape-2"></div>

  <header class="topbar">
    <div>
      <p class="eyebrow">Persoenlicher Browser Hub</p>
      <h1>Archiv</h1>
      <p class="search-info">Archivierte Lesezeichen als separate Linkliste.</p>
    </div>
    <div class="topbar-actions">
      <a class="gear-link" href="/" aria-label="Zur Startseite">Zurueck</a>
    </div>
  </header>

  <main class="overview-main">
    <section class="panel">
      <h2>Archivierte Links</h2>
      <p id="archive-summary" class="search-info"></p>
      <div id="archive-groups" class="archive-groups"></div>
    </section>
  </main>

  <footer class="metal-footer" aria-live="polite">
    <div class="metal-footer-inner">
      <p class="metal-footer-title">Edelmetall Ankauf (Bankhandelsfaehig)</p>
      <p class="metal-footer-values">
        <span>Gold: <strong id="metal-price-gold">-</strong></span>
        <span>Silber: <strong id="metal-price-silver">-</strong></span>
        <span>Top 1oz: <strong><a id="metal-price-best-silver" href="/silver-preise">-</a></strong></span>
      </p>
      <p id="metal-price-updated" class="metal-footer-updated">Stand: -</p>
      <p id="metal-price-hint" class="metal-footer-hint">Quelle: scheideanstalt.de</p>
      <a class="metal-footer-link" href="/silver-preise">Silberpreis Finder öffnen</a>
    </div>
  </footer>

  <p id="status" class="status"></p>
  <script src="/static/archive.js" defer></script>
  <script src="/static/metal-prices.js" defer></script>
</body>
</html>
