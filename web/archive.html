<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lesezeichen Archiv</title>
  <script src="/static/theme.js"></script>
  <script src="/static/navigation.js" defer></script>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="bg-shape bg-shape-1"></div>
  <div class="bg-shape bg-shape-2"></div>

  <header class="topbar">
    <div>
      <p class="eyebrow">Persönlicher Browser Hub</p>
      <h1>Archiv</h1>
    </div>
  </header>

  <main class="overview-main">
    <section class="panel">
      <div class="archive-toolbar" role="search" aria-label="Archiv durchsuchen">
        <label class="archive-search" for="archive-search">Suche
          <input id="archive-search" type="search" placeholder="Titel, URL, Tags oder Notizen" autocomplete="off" disabled />
        </label>
        <label for="archive-group">Gruppe
          <select id="archive-group" disabled><option value="">Alle Gruppen</option></select>
        </label>
        <label for="archive-sort">Sortierung
          <select id="archive-sort" disabled>
            <option value="title">Titel A–Z</option>
            <option value="newest">Zuletzt aktualisiert</option>
            <option value="domain">Domain A–Z</option>
          </select>
        </label>
        <label for="archive-page-size">Einträge pro Seite
          <select id="archive-page-size" disabled>
            <option value="25">25</option><option value="50">50</option><option value="100">100</option>
          </select>
        </label>
      </div>
      <p id="archive-summary" class="search-info" role="status"></p>
      <div id="archive-groups" class="archive-groups"></div>
    </section>
  </main>

  <footer class="metal-footer" aria-live="polite">
    <div class="metal-footer-inner">
      <p class="metal-footer-title">Edelmetall Ankauf (Bankhandelsfaehig)</p>
      <p class="metal-footer-values">
        <span>Gold: <strong id="metal-price-gold">-</strong></span>
        <span>Silber: <strong id="metal-price-silver">-</strong></span>
        <span>Top 1oz: <strong><a id="metal-price-best-silver" href="/silver-preise">-</a></strong></span>
      </p>
      <p id="metal-price-updated" class="metal-footer-updated">Stand: -</p>
      <p id="metal-price-hint" class="metal-footer-hint">Quelle: scheideanstalt.de</p>
      <a class="metal-footer-link" href="/silver-preise">Silberpreis Finder öffnen</a>
    </div>
  </footer>

  <p id="status" class="status"></p>
  <script src="/static/archive.js" defer></script>
  <script src="/static/metal-prices.js" defer></script>
</body>
</html>
