<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lesezeichen – Notizen</title>
  <script src="/static/theme.js"></script>
  <script src="/static/navigation.js" defer></script>
  <link rel="stylesheet" href="/static/styles.css" />
  <style>
    .notes-layout {
      display: grid;
      grid-template-columns: minmax(240px, 320px) 1fr;
      gap: 0;
      height: calc(100vh - 88px);
      overflow: hidden;
      position: relative;
      z-index: 2;
    }

    /* ── Sidebar ── */
    .notes-sidebar {
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      background: rgba(10, 18, 28, 0.72);
      overflow: hidden;
    }

    .notes-sidebar-head {
      padding: 14px 14px 10px;
      border-bottom: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .notes-search-wrap {
      position: relative;
    }

    .notes-search {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 9px 12px;
      color: var(--ink);
      background: rgba(17, 29, 45, 0.8);
      outline: none;
      font-size: 0.88rem;
    }

    .notes-search:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--ring);
    }

    .notes-search::placeholder { color: #89a0c0; }

    .btn-new-note {
      width: 100%;
      background: var(--accent);
      color: #0a1018;
      border: none;
      border-radius: 10px;
      padding: 9px 12px;
      font-weight: 700;
      font-size: 0.88rem;
      cursor: pointer;
      transition: filter 120ms ease;
    }

    .btn-new-note:hover { filter: brightness(1.12); }

    .btn-bookmark-notes {
      width: 100%;
      background: transparent;
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px 12px;
      font-weight: 600;
      font-size: 0.82rem;
      cursor: pointer;
      transition: border-color 120ms ease, color 120ms ease, background 120ms ease;
    }

    .notes-sidebar-toggles {
      display: flex;
      gap: 8px;
    }

    .notes-sidebar-toggles .btn-bookmark-notes {
      flex: 1;
      width: auto;
    }

    .btn-bookmark-notes:hover,
    .btn-bookmark-notes.active {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(44, 183, 161, 0.1);
    }

    .notes-list {
      flex: 1;
      overflow-y: auto;
      padding: 6px 0;
    }

    .note-item {
      padding: 10px 14px;
      cursor: pointer;
      border-bottom: 1px solid rgba(147, 170, 201, 0.1);
      transition: background 100ms ease;
    }

    .note-item:hover { background: rgba(44, 183, 161, 0.07); }
    .note-item.active { background: rgba(44, 183, 161, 0.14); border-left: 3px solid var(--accent); }
    .note-item.has-orphan { border-left: 3px solid var(--danger); }

    .note-item-title {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--ink);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .note-item-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 3px;
    }

    .note-item-preview {
      font-size: 0.76rem;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    .type-badge {
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      padding: 2px 7px;
      border-radius: 999px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .type-note    { background: rgba(44, 183, 161, 0.18); color: #2cb7a1; }
    .type-code    { background: rgba(99, 140, 240, 0.18); color: #7ba4f7; }
    .type-annotation { background: rgba(240, 180, 60, 0.18); color: #e8b84b; }
    .type-vault   { background: rgba(199, 79, 87, 0.2); color: #ff8b93; }
    .type-checklist { background: rgba(155, 129, 224, 0.2); color: #b79bf0; }

    .notes-section-title {
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      padding: 10px 14px 6px;
      border-top: 1px solid rgba(147, 170, 201, 0.1);
    }

    .note-item-date {
      font-size: 0.68rem;
      color: var(--muted);
      flex-shrink: 0;
    }

    .notes-empty {
      padding: 24px 14px;
      color: var(--muted);
      font-size: 0.85rem;
      text-align: center;
    }

    /* ── Grouped view ── */
    .group-root { padding: 4px 0; }

    .group-row {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      cursor: pointer;
      border-bottom: 1px solid rgba(147, 170, 201, 0.1);
      transition: background 100ms ease;
    }

    .group-row:hover { background: rgba(44, 183, 161, 0.06); }
    .group-row:hover .group-actions { opacity: 1; }

    .group-toggle {
      width: 12px;
      flex-shrink: 0;
      color: var(--muted);
      font-size: 0.7rem;
    }

    .group-name {
      flex: 1;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .group-count {
      font-size: 0.7rem;
      color: var(--muted);
      background: rgba(147, 170, 201, 0.12);
      border-radius: 999px;
      padding: 1px 7px;
      flex-shrink: 0;
    }

    .group-actions {
      display: flex;
      gap: 4px;
      opacity: 0;
      transition: opacity 120ms ease;
      flex-shrink: 0;
    }

    .group-action-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 0.8rem;
      padding: 2px 4px;
      border-radius: 4px;
    }

    .group-action-btn:hover { color: var(--accent); background: rgba(44, 183, 161, 0.1); }

    /* ── Detail / Editor ── */
    .notes-detail {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .notes-detail-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      border-bottom: 1px solid var(--line);
      gap: 10px;
      flex-wrap: wrap;
    }

    .notes-detail-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--ink);
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .notes-detail-actions {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    .notes-detail-head.hidden { display: none; }

    .notes-detail-body {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }

    .notes-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--muted);
      gap: 10px;
      text-align: center;
    }

    .notes-placeholder-icon { font-size: 3rem; opacity: 0.4; }
    .notes-placeholder p { margin: 0; font-size: 0.9rem; }

    /* ── Note View ── */
    .note-view-content {
      line-height: 1.7;
      font-size: 0.93rem;
      color: var(--ink);
      white-space: pre-wrap;
      word-break: break-word;
    }

    .checklist-view {
      line-height: 1.5;
      font-size: 0.93rem;
      color: var(--ink);
      white-space: normal;
      word-break: break-word;
    }

    .note-view-content.is-code {
      font-family: "Cascadia Code", "Fira Code", "Consolas", monospace;
      background: rgba(10, 16, 26, 0.7);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 16px;
      font-size: 0.86rem;
      overflow-x: auto;
      white-space: pre;
    }

    .note-view-code-block {
      font-family: "Cascadia Code", "Fira Code", "Consolas", monospace;
      background: rgba(10, 16, 26, 0.7);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px 16px;
      margin: 12px 0;
      font-size: 0.86rem;
      line-height: 1.5;
      overflow-x: auto;
      white-space: pre;
    }

    .note-view-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 16px;
    }

    .note-tag {
      font-size: 0.74rem;
      padding: 3px 10px;
      border-radius: 999px;
      background: rgba(44, 183, 161, 0.13);
      color: var(--accent);
      border: 1px solid rgba(44, 183, 161, 0.25);
    }

    .note-view-bookmarks {
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
    }

    .note-view-bookmarks h4 {
      margin: 0 0 10px;
      font-size: 0.8rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .linked-bookmark-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .linked-bookmark {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: rgba(16, 26, 40, 0.7);
      border: 1px solid var(--line);
      border-radius: 8px;
      text-decoration: none;
      color: var(--ink);
      font-size: 0.84rem;
      transition: border-color 120ms ease;
      overflow: hidden;
    }

    .linked-bookmark:hover { border-color: var(--accent); }

    .linked-bookmark-title {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .linked-bookmark-url {
      font-size: 0.74rem;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 200px;
    }

    .linked-bookmark.orphaned {
      border-color: rgba(199, 79, 87, 0.4);
      color: var(--danger);
      cursor: default;
      pointer-events: none;
    }

    .orphaned-indicator {
      margin-right: 6px;
    }

    /* ── Editor form ── */
    .note-editor {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .note-editor label {
      display: flex;
      flex-direction: column;
      gap: 5px;
      font-size: 0.82rem;
      color: var(--muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    #vault-password-wrap.hidden { display: none; }

    .note-editor input,
    .note-editor select,
    .note-editor textarea {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 9px 12px;
      color: var(--ink);
      background: rgba(17, 29, 45, 0.8);
      font-family: inherit;
      font-size: 0.9rem;
      outline: none;
      width: 100%;
    }

    .note-editor input:focus,
    .note-editor select:focus,
    .note-editor textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--ring);
    }

    .note-editor textarea {
      resize: vertical;
      min-height: 360px;
      line-height: 1.6;
    }

    .note-editor textarea.is-code {
      font-family: "Cascadia Code", "Fira Code", "Consolas", monospace;
      font-size: 0.85rem;
    }

    .note-editor select option { background: #101a27; }

    .editor-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      margin-top: 4px;
    }

    .btn-save {
      background: var(--accent);
      color: #0a1018;
      border: none;
      border-radius: 8px;
      padding: 9px 20px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      transition: filter 120ms ease;
    }
    .btn-save:hover { filter: brightness(1.12); }

    .btn-cancel, .btn-edit, .btn-delete {
      background: transparent;
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 7px 16px;
      font-size: 0.88rem;
      cursor: pointer;
      transition: border-color 120ms ease, color 120ms ease;
    }
    .btn-cancel:hover, .btn-edit:hover { border-color: var(--accent); color: var(--accent); }
    .btn-delete { color: var(--danger); border-color: transparent; }
    .btn-delete:hover { border-color: var(--danger); }
    .btn-copy:hover { border-color: #7ba4f7; color: #7ba4f7; }

    .vault-panel {
      margin-top: 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px;
      background: rgba(16, 26, 40, 0.65);
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .vault-input {
      flex: 1;
      min-width: 180px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px 10px;
      color: var(--ink);
      background: rgba(17, 29, 45, 0.8);
      outline: none;
      font-size: 0.86rem;
    }

    .vault-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--ring);
    }

    .note-meta-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .note-meta-date {
      font-size: 0.78rem;
      color: var(--muted);
    }

    /* ── Checklist / Workflow ── */
    .checklist-progress {
      margin-bottom: 16px;
    }

    .checklist-progress-bar {
      height: 6px;
      border-radius: 999px;
      background: rgba(147, 170, 201, 0.15);
      overflow: hidden;
    }

    .checklist-progress-fill {
      height: 100%;
      background: var(--accent);
      transition: width 160ms ease;
    }

    .checklist-progress-label {
      font-size: 0.78rem;
      color: var(--muted);
      margin-top: 6px;
    }

    .checklist-group-title {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--ink);
      margin: 14px 0 4px;
    }

    .checklist-group-title:first-child { margin-top: 0; }

    .checklist-list {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .checklist-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 0 4px;
      border-radius: 6px;
      cursor: pointer;
    }

    .checklist-item:hover { background: rgba(44, 183, 161, 0.06); }

    .checklist-item input[type="checkbox"] {
      margin-top: 3px;
      width: 16px;
      height: 16px;
      accent-color: var(--accent);
      cursor: pointer;
      flex-shrink: 0;
    }

    .checklist-item-text {
      font-size: 0.9rem;
      color: var(--ink);
      line-height: 1.3;
    }

    .checklist-item.is-done .checklist-item-text {
      color: var(--muted);
      text-decoration: line-through;
    }

    .checklist-text-line {
      font-size: 0.88rem;
      color: var(--muted);
      margin: 4px 0;
    }

    .checklist-add-row {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .checklist-add-input {
      flex: 1;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px 12px;
      color: var(--ink);
      background: rgba(17, 29, 45, 0.8);
      outline: none;
      font-size: 0.86rem;
    }

    .checklist-add-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--ring);
    }

    .checklist-add-row .btn-add-step {
      align-self: stretch;
    }

    .btn-add-step {
      align-self: flex-start;
      background: transparent;
      color: var(--accent);
      border: 1px dashed var(--accent);
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-add-step:hover { background: rgba(44, 183, 161, 0.1); }

    .checklist-hint {
      font-size: 0.76rem;
      color: var(--muted);
      font-weight: 400;
      text-transform: none;
      letter-spacing: 0;
    }

    @media (max-width: 700px) {
      .notes-layout {
        grid-template-columns: 1fr;
        height: auto;
      }
      .notes-sidebar {
        border-right: none;
        border-bottom: 1px solid var(--line);
        max-height: 40vh;
      }
    }
  </style>
</head>
<body>
  <div class="bg-shape bg-shape-1"></div>
  <div class="bg-shape bg-shape-2"></div>

  <header class="topbar">
    <div>
      <p class="eyebrow">Persönlicher Browser Hub</p>
      <h1>Notizen <span id="notes-title-count" style="font-size:0.7em;color:var(--muted);font-weight:400;margin-left:8px"></span></h1>
      <p class="search-info">Codeschnipsel, Anmerkungen und Notizen zu Lesezeichen.</p>
    </div>
  </header>

  <div class="notes-layout">
    <!-- Sidebar -->
    <aside class="notes-sidebar">
      <div class="notes-sidebar-head">
        <div class="notes-search-wrap">
          <input id="notes-search" class="notes-search" type="search" placeholder="Suche in Notizen..." autocomplete="off" />
          <button id="notes-search-clear" class="search-clear hidden" type="button" aria-label="Suche leeren">X</button>
        </div>
        <div class="notes-sidebar-toggles">
          <button id="btn-bookmark-notes" class="btn-bookmark-notes" type="button" aria-pressed="false">Lesezeichen-Notizen</button>
          <button id="btn-tree-view" class="btn-bookmark-notes" type="button" aria-pressed="false">&#128193; Gruppen</button>
        </div>
        <button id="btn-new-group" class="btn-add-step hidden" type="button">+ Neue Gruppe</button>
        <button id="btn-new-note" class="btn-new-note" type="button">+ Neue Notiz</button>
      </div>
      <div id="notes-list" class="notes-list">
        <p class="notes-empty">Lade Notizen…</p>
      </div>
    </aside>

    <!-- Detail / Editor -->
    <section class="notes-detail">
      <div id="detail-head" class="notes-detail-head hidden">
        <span id="detail-title-label" class="notes-detail-title"></span>
        <div class="notes-detail-actions">
          <button id="btn-copy" class="btn-copy btn-edit" type="button">Kopieren</button>
          <button id="btn-edit" class="btn-edit" type="button">Bearbeiten</button>
          <button id="btn-delete" class="btn-delete" type="button">Löschen</button>
        </div>
      </div>
      <div id="notes-detail-body" class="notes-detail-body">
        <div class="notes-placeholder">
          <div class="notes-placeholder-icon">&#128221;</div>
          <p>Wähle eine Notiz aus oder lege eine neue an.</p>
        </div>
      </div>
    </section>
  </div>

  <p id="status" class="status"></p>
  <script src="/static/notes.js" defer></script>
</body>
</html>
