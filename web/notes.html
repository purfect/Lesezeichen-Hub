<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lesezeichen – Notizen</title>
  <link rel="stylesheet" href="/static/styles.css" />
  <style>
    .notes-layout {
      display: grid;
      grid-template-columns: minmax(240px, 320px) 1fr;
      gap: 0;
      height: calc(100vh - 88px);
      overflow: hidden;
      position: relative;
      z-index: 2;
    }

    /* ── Sidebar ── */
    .notes-sidebar {
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      background: rgba(10, 18, 28, 0.72);
      overflow: hidden;
    }

    .notes-sidebar-head {
      padding: 14px 14px 10px;
      border-bottom: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .notes-search-wrap {
      position: relative;
    }

    .notes-search {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 9px 12px;
      color: var(--ink);
      background: rgba(17, 29, 45, 0.8);
      outline: none;
      font-size: 0.88rem;
    }

    .notes-search:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--ring);
    }

    .notes-search::placeholder { color: #89a0c0; }

    .btn-new-note {
      width: 100%;
      background: var(--accent);
      color: #0a1018;
      border: none;
      border-radius: 10px;
      padding: 9px 12px;
      font-weight: 700;
      font-size: 0.88rem;
      cursor: pointer;
      transition: filter 120ms ease;
    }

    .btn-new-note:hover { filter: brightness(1.12); }

    .notes-list {
      flex: 1;
      overflow-y: auto;
      padding: 6px 0;
    }

    .note-item {
      padding: 10px 14px;
      cursor: pointer;
      border-bottom: 1px solid rgba(147, 170, 201, 0.1);
      transition: background 100ms ease;
    }

    .note-item:hover { background: rgba(44, 183, 161, 0.07); }
    .note-item.active { background: rgba(44, 183, 161, 0.14); border-left: 3px solid var(--accent); }

    .note-item-title {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--ink);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .note-item-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 3px;
    }

    .note-item-preview {
      font-size: 0.76rem;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    .type-badge {
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      padding: 2px 7px;
      border-radius: 999px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .type-note    { background: rgba(44, 183, 161, 0.18); color: #2cb7a1; }
    .type-code    { background: rgba(99, 140, 240, 0.18); color: #7ba4f7; }
    .type-annotation { background: rgba(240, 180, 60, 0.18); color: #e8b84b; }

    .note-item-date {
      font-size: 0.68rem;
      color: var(--muted);
      flex-shrink: 0;
    }

    .notes-empty {
      padding: 24px 14px;
      color: var(--muted);
      font-size: 0.85rem;
      text-align: center;
    }

    /* ── Detail / Editor ── */
    .notes-detail {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .notes-detail-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      border-bottom: 1px solid var(--line);
      gap: 10px;
      flex-wrap: wrap;
    }

    .notes-detail-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--ink);
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .notes-detail-actions {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    .notes-detail-body {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }

    .notes-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--muted);
      gap: 10px;
      text-align: center;
    }

    .notes-placeholder-icon { font-size: 3rem; opacity: 0.4; }
    .notes-placeholder p { margin: 0; font-size: 0.9rem; }

    /* ── Note View ── */
    .note-view-content {
      line-height: 1.7;
      font-size: 0.93rem;
      color: var(--ink);
      white-space: pre-wrap;
      word-break: break-word;
    }

    .note-view-content.is-code {
      font-family: "Cascadia Code", "Fira Code", "Consolas", monospace;
      background: rgba(10, 16, 26, 0.7);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 16px;
      font-size: 0.86rem;
      overflow-x: auto;
      white-space: pre;
    }

    .note-view-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 16px;
    }

    .note-tag {
      font-size: 0.74rem;
      padding: 3px 10px;
      border-radius: 999px;
      background: rgba(44, 183, 161, 0.13);
      color: var(--accent);
      border: 1px solid rgba(44, 183, 161, 0.25);
    }

    .note-view-bookmarks {
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
    }

    .note-view-bookmarks h4 {
      margin: 0 0 10px;
      font-size: 0.8rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .linked-bookmark-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .linked-bookmark {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: rgba(16, 26, 40, 0.7);
      border: 1px solid var(--line);
      border-radius: 8px;
      text-decoration: none;
      color: var(--ink);
      font-size: 0.84rem;
      transition: border-color 120ms ease;
      overflow: hidden;
    }

    .linked-bookmark:hover { border-color: var(--accent); }

    .linked-bookmark-title {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .linked-bookmark-url {
      font-size: 0.74rem;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 200px;
    }

    /* ── Editor form ── */
    .note-editor {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .note-editor label {
      display: flex;
      flex-direction: column;
      gap: 5px;
      font-size: 0.82rem;
      color: var(--muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .note-editor input,
    .note-editor select,
    .note-editor textarea {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 9px 12px;
      color: var(--ink);
      background: rgba(17, 29, 45, 0.8);
      font-family: inherit;
      font-size: 0.9rem;
      outline: none;
      width: 100%;
    }

    .note-editor input:focus,
    .note-editor select:focus,
    .note-editor textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--ring);
    }

    .note-editor textarea {
      resize: vertical;
      min-height: 160px;
      line-height: 1.6;
    }

    .note-editor textarea.is-code {
      font-family: "Cascadia Code", "Fira Code", "Consolas", monospace;
      font-size: 0.85rem;
    }

    .note-editor select option { background: #101a27; }

    .editor-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      margin-top: 4px;
    }

    .btn-save {
      background: var(--accent);
      color: #0a1018;
      border: none;
      border-radius: 8px;
      padding: 9px 20px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      transition: filter 120ms ease;
    }
    .btn-save:hover { filter: brightness(1.12); }

    .btn-cancel, .btn-edit, .btn-delete {
      background: transparent;
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 7px 16px;
      font-size: 0.88rem;
      cursor: pointer;
      transition: border-color 120ms ease, color 120ms ease;
    }
    .btn-cancel:hover, .btn-edit:hover { border-color: var(--accent); color: var(--accent); }
    .btn-delete { color: var(--danger); border-color: transparent; }
    .btn-delete:hover { border-color: var(--danger); }

    .note-meta-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .note-meta-date {
      font-size: 0.78rem;
      color: var(--muted);
    }

    @media (max-width: 700px) {
      .notes-layout {
        grid-template-columns: 1fr;
        height: auto;
      }
      .notes-sidebar {
        border-right: none;
        border-bottom: 1px solid var(--line);
        max-height: 40vh;
      }
    }
  </style>
</head>
<body>
  <div class="bg-shape bg-shape-1"></div>
  <div class="bg-shape bg-shape-2"></div>

  <header class="topbar">
    <div>
      <p class="eyebrow">Persoenlicher Browser Hub</p>
      <h1>Notizen</h1>
      <p class="search-info">Codeschnipsel, Anmerkungen und Notizen zu Lesezeichen.</p>
    </div>
    <div class="topbar-actions">
      <a class="gear-link" href="/" aria-label="Zur Startseite" title="Startseite">&#127968;</a>
    </div>
  </header>

  <div class="notes-layout">
    <!-- Sidebar -->
    <aside class="notes-sidebar">
      <div class="notes-sidebar-head">
        <div class="notes-search-wrap">
          <input id="notes-search" class="notes-search" type="search" placeholder="Suche in Notizen..." autocomplete="off" />
        </div>
        <button id="btn-new-note" class="btn-new-note" type="button">+ Neue Notiz</button>
      </div>
      <div id="notes-list" class="notes-list">
        <p class="notes-empty">Lade Notizen…</p>
      </div>
    </aside>

    <!-- Detail / Editor -->
    <section class="notes-detail">
      <div id="detail-head" class="notes-detail-head hidden">
        <span id="detail-title-label" class="notes-detail-title"></span>
        <div class="notes-detail-actions">
          <button id="btn-edit" class="btn-edit" type="button">Bearbeiten</button>
          <button id="btn-delete" class="btn-delete" type="button">Loeschen</button>
        </div>
      </div>
      <div id="notes-detail-body" class="notes-detail-body">
        <div class="notes-placeholder">
          <div class="notes-placeholder-icon">&#128221;</div>
          <p>Waehle eine Notiz aus oder lege eine neue an.</p>
        </div>
      </div>
    </section>
  </div>

  <p id="status" class="status"></p>
  <script src="/static/notes.js" defer></script>
</body>
</html>
